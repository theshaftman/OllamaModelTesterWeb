apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-tester-frontend-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://ollama-tester-backend-service:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;

            proxy_buffering off;
        }

        location /documents/ {
            proxy_pass http://ollama-tester-backend-service:3001/documents/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location /charts/ {
            proxy_pass http://ollama-tester-backend-service:3001/charts/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-tester-frontend
  labels:
    app: ollama-tester-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-tester-frontend
  template:
    metadata:
      labels:
        app: ollama-tester-frontend
    spec:
      containers:
      - name: frontend
        image: ollama-tester-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_URL
          value: "http://ollama-tester-backend-service:3001"
        - name: REACT_APP_API_URL
          value: "http://ollama-tester-backend-service:3001"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: nginx-config
        configMap:
          name: ollama-tester-frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-tester-frontend-service
spec:
  selector:
    app: ollama-tester-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  type: NodePort