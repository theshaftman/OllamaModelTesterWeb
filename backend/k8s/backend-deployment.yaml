apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-tester-backend
  labels:
    app: ollama-tester-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-tester-backend
  template:
    metadata:
      labels:
        app: ollama-tester-backend
    spec:
      containers:
      - name: ollama-tester-backend
        image: ollama-tester-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        env:
        - name: OLLAMA_HOST
          value: "127.0.0.1"
        - name: OLLAMA_PORT
          value: "11434"
        - name: START_OLLAMA
          value: "true" 
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_KEEP_ALIVE
          value: "0"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        - name: OLLAMA_CONTEXT_LENGTH
          value: "512"
        resources:
          requests:
            memory: "2Gi"
            cpu: "2"
          limits:
            memory: "5Gi"
            cpu: "4"
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-tester-backend-service
spec:
  selector:
    app: ollama-tester-backend
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP